{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déconnexion - AI Image Generator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full text-center">
            <!-- Icône de succès -->
            <div class="mx-auto h-20 w-20 bg-green-100 rounded-full flex items-center justify-center mb-6">
                <i class="fas fa-check-circle text-green-600 text-3xl"></i>
            </div>
            
            <!-- Message de déconnexion -->
            <h2 class="text-3xl font-extrabold text-gray-900 mb-4">
                Déconnexion réussie
            </h2>
            
            <p class="text-lg text-gray-600 mb-8">
                Vous avez été déconnecté avec succès de votre compte.
            </p>
            
            <!-- Bouton de reconnexion -->
            <div class="space-y-4">
                <a href="{% url 'login' %}" 
                   class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 transition-colors">
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    Se reconnecter
                </a>
                
                <div class="text-sm text-gray-500">
                    <p>Merci d'avoir utilisé AI Image Generator</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
